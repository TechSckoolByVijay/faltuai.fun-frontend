<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Read latest engineering blogs from FaltuFun." />
    <title>FaltuFun Blog</title>
    <style>
      :root {
        --bg: #0b1020;
        --surface: #121a2b;
        --surface-2: #1a2438;
        --text: #edf2ff;
        --muted: #9fb0d0;
        --border: #273553;
        --brand: #7aa2ff;
        --danger: #ff7272;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, Segoe UI, Roboto, sans-serif;
        background: radial-gradient(circle at top, #16223e 0%, var(--bg) 45%);
        color: var(--text);
        min-height: 100vh;
      }
      .container { width: min(1100px, 92vw); margin: 0 auto; padding: 32px 0 56px; }
      .hero { margin-bottom: 24px; }
      .hero h1 { margin: 0; font-size: clamp(1.8rem, 4vw, 2.6rem); }
      .hero p { margin-top: 8px; color: var(--muted); }
      .blog-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 18px; }
      .blog-card {
        display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: inherit;
        background: linear-gradient(145deg, var(--surface), var(--surface-2));
        border: 1px solid var(--border); border-radius: 16px; overflow: hidden;
        transition: transform 0.2s ease, border-color 0.2s ease;
      }
      .blog-card:hover { transform: translateY(-3px); border-color: var(--brand); }
      .blog-card-cover { width: 100%; height: 170px; object-fit: cover; background: #0f162a; }
      .blog-card-body { padding: 14px 14px 16px; }
      .blog-card-title { margin: 0; font-size: 1.05rem; }
      .blog-card-description { margin: 8px 0 10px; color: var(--muted); line-height: 1.45; font-size: 0.95rem; }
      .blog-card-date { font-size: 0.84rem; color: #b8c7e7; }
      .blog-card-tags { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; }
      .blog-tag { display: inline-flex; align-items: center; padding: 5px 10px; border-radius: 999px; background: #182844; color: #b8ccff; font-size: 0.76rem; border: 1px solid #294271; }
      .blog-state { border: 1px dashed var(--border); border-radius: 12px; padding: 22px; color: var(--muted); text-align: center; }
      .blog-state-error { color: var(--danger); border-color: #8a2f2f; }
      .hero-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
      .top-link {
        display: inline-flex; align-items: center; padding: 10px 16px; border-radius: 12px;
        text-decoration: none; font-weight: 600; color: var(--text);
        background: rgba(18, 26, 43, 0.9); border: 1px solid var(--border);
        transition: background 0.2s ease, border-color 0.2s ease;
      }
      .top-link:hover { background: #16223e; border-color: var(--brand); }
    </style>
  </head>
  <body>
    <main class="container">
      <div class="hero-row">
        <section class="hero">
          <h1>Engineering Blog</h1>
          <p>Notes on AI, DevOps, cloud, and practical software delivery.</p>
        </section>
        <a id="back-home-link" class="top-link" href="/#/">← Back to Home</a>
      </div>

      <section id="blog-list-root" class="blog-grid" aria-live="polite"></section>

      <template id="blog-card-template">
        <a class="blog-card" href="#">
          <img class="blog-card-cover" src="" alt="" loading="lazy" />
          <div class="blog-card-body">
            <h2 class="blog-card-title"></h2>
            <p class="blog-card-description"></p>
            <div class="blog-card-date"></div>
            <div class="blog-card-tags"></div>
          </div>
        </a>
      </template>
    </main>

    <script src="/blog/scripts/blog-navigation.js" defer></script>
    <script src="/blog/scripts/blog-list.js" defer></script>
  </body>
</html>
