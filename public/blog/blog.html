<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Read engineering insights on FaltuFun Blog." />
    <title>Blog | FaltuFun</title>
    <style>
      :root {
        --bg: #0b1020; --surface: #121a2b; --surface-2: #1a2438; --text: #edf2ff;
        --muted: #9fb0d0; --border: #273553; --brand: #7aa2ff; --danger: #ff7272;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; font-family: Inter, Segoe UI, Roboto, sans-serif; color: var(--text);
        background: radial-gradient(circle at top, #16223e 0%, var(--bg) 45%);
      }
      .container { width: min(860px, 92vw); margin: 0 auto; padding: 28px 0 60px; }
      .back-link { display: inline-block; margin-bottom: 20px; color: var(--brand); text-decoration: none; }
      .blog-header { margin-bottom: 20px; }
      .blog-title { margin: 0; font-size: clamp(1.8rem, 4vw, 2.4rem); }
      .blog-meta { margin: 8px 0 0; color: #b8c7e7; font-size: 0.94rem; }
      .blog-summary { margin: 10px 0 0; color: var(--muted); }
      .markdown-body {
        background: linear-gradient(145deg, var(--surface), var(--surface-2));
        border: 1px solid var(--border); border-radius: 16px; padding: 24px; line-height: 1.7;
      }
      .markdown-body h1, .markdown-body h2, .markdown-body h3 { line-height: 1.3; margin-top: 1.2em; }
      .markdown-body p { color: #dee7ff; }
      .markdown-body img { max-width: 100%; border-radius: 10px; border: 1px solid var(--border); }
      .markdown-body pre {
        overflow-x: auto; padding: 12px; border-radius: 10px; background: #0c1428; border: 1px solid #1f2f51;
      }
      .markdown-body code { font-family: Consolas, Monaco, monospace; }
      .blog-state { border: 1px dashed var(--border); border-radius: 12px; padding: 22px; color: var(--muted); text-align: center; }
      .blog-state-error { color: var(--danger); border-color: #8a2f2f; }
    </style>
  </head>
  <body>
    <main class="container">
      <a class="back-link" href="/blog/index.html">← Back to blogs</a>
      <header id="blog-header" class="blog-header"></header>
      <article id="blog-content" class="markdown-body" aria-live="polite"></article>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
    <script src="/blog/scripts/blog-render.js" defer></script>
  </body>
</html>
